<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface-2: #fbfaf8;
    --ink: #161616;
    --ink-2: #3b3b3b;
    --muted: #767168;
    --line: #e7e2da;
    --line-2: #f0ece6;
    --gold: #b08d57;
    --gold-ink: #8a6a3a;
    --gold-soft: #f5eee2;
    --side: #121212;
    --side-ink: #d8d4cd;
    --ok: #2e7d4f;
    --ok-soft: #e7f3ec;
    --warn: #a86b12;
    --warn-soft: #fbf1e0;
    --bad: #b3261e;
    --bad-soft: #fbe9e7;
    --info: #3d5a80;
    --info-soft: #e8eef6;
    --radius: 16px;
    --radius-sm: 10px;
    --shadow: 0 1px 2px rgba(20, 16, 10, .04), 0 4px 16px rgba(20, 16, 10, .05);
    --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }
  a { color: var(--gold-ink); text-decoration: none; }
  a:hover { text-decoration: underline; }
  h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
  h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; }
  h2 { font-size: 17px; }
  h3 { font-size: 15px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; }
  .right { text-align: right; }
  .nowrap { white-space: nowrap; }

  /* ---------- Boot & login ---------- */
  .boot { min-height: 100vh; display: grid; place-items: center; text-align: center; }
  .brand-mark { font-family: var(--serif); font-size: 28px; letter-spacing: .02em; }
  .brand-mark span { color: var(--gold); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; margin: 18px auto 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: linear-gradient(160deg, #141414 0%, #1f1c18 60%, #2b241a 100%); }
  .login-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: 20px; padding: 32px 28px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .login-card .brand-mark { font-size: 26px; }
  .login-card .eyebrow { margin-top: 6px; }
  .login-card form { margin-top: 24px; display: grid; gap: 14px; }

  /* ---------- Shell ---------- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 252px; flex: 0 0 252px; background: var(--side); color: var(--side-ink); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .sidebar .brand { padding: 26px 22px 18px; border-bottom: 1px solid rgba(255,255,255,.06); }
  .sidebar .brand .brand-mark { color: #fff; font-size: 22px; }
  .sidebar .brand .sub { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: #8d877d; margin-top: 4px; }
  .nav { padding: 14px 10px; flex: 1; overflow-y: auto; }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin: 2px 0; border-radius: 10px; color: var(--side-ink); font-size: 14px; position: relative; }
  .nav a:hover { background: rgba(255,255,255,.05); text-decoration: none; }
  .nav a.active { background: rgba(176,141,87,.14); color: #fff; }
  .nav a.active::before { content: ''; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--gold); }
  .nav svg { width: 18px; height: 18px; flex: 0 0 18px; opacity: .85; }
  .side-user { padding: 16px 18px 20px; border-top: 1px solid rgba(255,255,255,.06); font-size: 13px; }
  .side-user .who { color: #fff; font-weight: 600; }
  .side-user .role { color: var(--gold); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; }
  .side-user .links { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; }
  .side-user .links a { color: #b9b3a9; font-size: 12.5px; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar { display: none; }
  .view { padding: 32px 36px 64px; max-width: 1280px; width: 100%; margin: 0 auto; }
  .scrim { display: none; }

  /* ---------- Page header ---------- */
  .page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
  .page-head .eyebrow { margin-bottom: 6px; }
  .eyebrow { font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-ink); font-weight: 600; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .toolbar select { width: auto; min-width: 190px; }
  .filters { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
  .filters .field { min-width: 150px; }

  /* ---------- Cards & KPIs ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 22px; }
  .card + .card, .section + .section { margin-top: 18px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .grid { display: grid; gap: 16px; }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpis.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); min-width: 0; }
  .kpi .label { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .kpi .value { font-size: 28px; font-weight: 600; margin-top: 6px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .kpi .hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .kpi.feature { background: var(--side); color: #fff; border-color: var(--side); }
  .kpi.feature .label { color: #b9b3a9; }
  .kpi.feature .value { color: #fff; font-size: 32px; }
  .kpi.feature .hint { color: #b9b3a9; }
  .kpi.gold { background: var(--gold-soft); border-color: #eadcc2; }
  .kpi.wide { grid-column: span 2; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .dl { display: grid; grid-template-columns: 180px 1fr; gap: 8px 16px; font-size: 14px; }
  .dl dt { color: var(--muted); }
  .dl dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }

  /* ---------- Progress ---------- */
  .progress { height: 10px; background: var(--line-2); border-radius: 99px; overflow: hidden; margin-top: 12px; }
  .progress > span { display: block; height: 100%; background: linear-gradient(90deg, #c9a66b, var(--gold)); border-radius: 99px; transition: width .6s ease; }
  .progress.done > span { background: linear-gradient(90deg, #3f9a66, var(--ok)); }
  .progress.sm { height: 6px; margin-top: 6px; }
  .feature .progress { background: rgba(255,255,255,.12); }

  /* ---------- Badges & alerts ---------- */
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--line-2); color: var(--ink-2); }
  .badge.Draft { background: #efefef; color: #555; }
  .badge.Active { background: var(--info-soft); color: var(--info); }
  .badge.Pending { background: var(--warn-soft); color: var(--warn); }
  .badge.Approved { background: var(--gold-soft); color: var(--gold-ink); }
  .badge.Paid { background: var(--ok-soft); color: var(--ok); }
  .badge.yes { background: var(--ok-soft); color: var(--ok); }
  .badge.no { background: var(--bad-soft); color: var(--bad); }
  .alert { border-radius: var(--radius-sm); padding: 12px 16px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; margin-bottom: 18px; border: 1px solid transparent; }
  .alert.info { background: var(--info-soft); color: #263c5a; border-color: #d3deec; }
  .alert.warn { background: var(--warn-soft); color: #6f4708; border-color: #f0dcb8; }
  .alert.ok { background: var(--ok-soft); color: #1d5234; border-color: #cfe6d8; }
  .alert.bad { background: var(--bad-soft); color: #7d1a14; border-color: #f2cbc7; }
  .alert .grow { flex: 1; }

  /* ---------- Buttons ---------- */
  .btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 9px 16px; font: 600 14px var(--sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background .15s, border-color .15s, transform .05s; min-height: 40px; }
  .btn:hover { background: var(--surface-2); border-color: #d6cfc4; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .btn.primary:hover { background: #2c2c2c; }
  .btn.gold { background: var(--gold); border-color: var(--gold); color: #fff; }
  .btn.gold:hover { background: var(--gold-ink); }
  .btn.danger { color: var(--bad); border-color: #efc9c5; }
  .btn.danger.solid { background: var(--bad); color: #fff; border-color: var(--bad); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.sm { padding: 5px 11px; font-size: 13px; min-height: 32px; border-radius: 8px; }
  .btn svg { width: 16px; height: 16px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .actions.one-line { flex-wrap: nowrap; justify-content: flex-end; }

  /* ---------- Forms ---------- */
  .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .field label, .label-sm { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
  .field .help { font-size: 12px; color: var(--muted); }
  input, select, textarea { font: 15px var(--sans); color: var(--ink); background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; min-height: 42px; }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(176,141,87,.18); }
  input[readonly] { background: var(--surface-2); color: var(--muted); }
  input[type=checkbox], input[type=radio] { width: 18px; height: 18px; min-height: 0; accent-color: var(--ink); padding: 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
  .check input { margin-top: 2px; flex: 0 0 auto; }
  .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .form-grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .span-2 { grid-column: span 2; }
  .span-all { grid-column: 1 / -1; }
  .form-section { border-top: 1px solid var(--line-2); padding-top: 22px; margin-top: 22px; }
  .form-section:first-child { border-top: 0; padding-top: 0; margin-top: 0; }
  .form-section > h2 { margin-bottom: 4px; }
  .form-section > p { margin: 0 0 16px; color: var(--muted); font-size: 13.5px; }
  .segmented { display: inline-flex; background: var(--line-2); border-radius: 10px; padding: 3px; gap: 3px; flex-wrap: wrap; }
  .segmented label { padding: 7px 14px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; color: var(--muted); }
  .segmented input { display: none; }
  .segmented label:has(input:checked) { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .form-error { background: var(--bad-soft); color: #7d1a14; border: 1px solid #f2cbc7; border-radius: 10px; padding: 10px 14px; font-size: 14px; }

  /* Tier editor rows */
  .tier-row { display: grid; grid-template-columns: 1fr 1fr 130px 1fr 40px; gap: 10px; align-items: end; padding: 10px 0; border-bottom: 1px dashed var(--line); }
  .tier-row.bonus { grid-template-columns: 1fr 1fr 40px; }
  .tier-row:last-child { border-bottom: 0; }
  .tier-row .field label { font-size: 11.5px; }
  .icon-btn { width: 40px; height: 42px; border: 1px solid var(--line); background: #fff; border-radius: 10px; cursor: pointer; display: grid; place-items: center; color: var(--muted); }
  .icon-btn:hover { color: var(--bad); border-color: #efc9c5; }
  .split-row { display: grid; grid-template-columns: 1fr 120px 120px 40px; gap: 10px; align-items: end; margin-bottom: 10px; }
  .split-total { font-size: 13px; font-weight: 600; }

  /* ---------- Tables → cards on mobile ---------- */
  .table-wrap { overflow-x: auto; }
  table.rtable { width: 100%; border-collapse: collapse; font-size: 14px; }
  .rtable th { text-align: left; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
  .rtable th.sortable { cursor: pointer; user-select: none; }
  .rtable th.sortable:hover { color: var(--ink); }
  .rtable th .arrow { color: var(--gold); margin-left: 4px; }
  .rtable td { padding: 12px 10px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
  .rtable tr:last-child td { border-bottom: 0; }
  .rtable tr.clickable { cursor: pointer; }
  .rtable tr.clickable:hover td { background: var(--surface-2); }
  .rtable tr.highlight td { background: var(--gold-soft); }
  .rtable tr.total td { font-weight: 700; border-top: 2px solid var(--line); background: var(--surface-2); }
  .rtable .right, .rtable th.right { text-align: right; }
  .cell-strong { font-weight: 600; }
  .cell-sub { font-size: 12.5px; color: var(--muted); }
  .empty { text-align: center; padding: 42px 16px; color: var(--muted); }
  .empty .big { font-family: var(--serif); font-size: 22px; color: var(--ink); margin-bottom: 6px; }
  .mobile-sort { display: none; }

  /* ---------- Modal, confirm, toast ---------- */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15, 12, 8, .55); display: flex; align-items: flex-start; justify-content: center; padding: 48px 16px; overflow-y: auto; z-index: 50; animation: fade .15s ease; }
  .modal { background: var(--surface); border-radius: 18px; width: 100%; max-width: 560px; box-shadow: 0 30px 80px rgba(0,0,0,.3); animation: pop .18s ease; }
  .modal.wide { max-width: 820px; }
  .modal-head { padding: 20px 24px 0; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .modal-head h2 { font-family: var(--serif); font-size: 22px; }
  .modal-body { padding: 18px 24px; display: grid; gap: 16px; }
  .modal-foot { padding: 0 24px 22px; display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
  .close-x { border: 0; background: transparent; font-size: 26px; line-height: 1; cursor: pointer; color: var(--muted); padding: 4px 8px; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: translateY(8px) scale(.98); opacity: 0; } }
  .toasts { position: fixed; right: 20px; bottom: 20px; display: grid; gap: 10px; z-index: 80; max-width: calc(100vw - 32px); }
  .toast { background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.25); display: flex; gap: 10px; align-items: center; animation: pop .2s ease; }
  .toast::before { content: '✓'; color: #8fd3a9; font-weight: 700; }
  .toast.error { background: var(--bad); }
  .toast.error::before { content: '!'; color: #fff; }

  /* ---------- Statement (printable) ---------- */
  .statement { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 44px 48px; max-width: 860px; margin: 0 auto; position: relative; box-shadow: var(--shadow); }
  .statement .st-head { text-align: center; border-bottom: 2px solid var(--ink); padding-bottom: 18px; margin-bottom: 24px; }
  .statement .st-studio { font-family: var(--serif); font-size: 26px; letter-spacing: .18em; text-transform: uppercase; }
  .statement .st-title { font-size: 12.5px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold-ink); margin-top: 6px; font-weight: 600; }
  .statement h3 { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 26px 0 10px; }
  .st-total td { font-size: 18px; font-weight: 700; border-top: 2px solid var(--ink) !important; }
  .watermark { position: absolute; top: 16px; right: 18px; font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--warn); border: 1.5px solid var(--warn); padding: 3px 9px; border-radius: 6px; }
  .watermark.final { color: var(--ok); border-color: var(--ok); }
  .statement .rtable td, .statement .rtable th { padding: 8px 10px; }
  .statement .sig { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; margin-top: 48px; }
  .statement .sig div { border-top: 1px solid var(--ink); padding-top: 6px; font-size: 12px; color: var(--muted); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1100px) {
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 900px) {
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); transition: transform .22s ease; }
    body.nav-open .sidebar { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 30; }
    .topbar { display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; background: rgba(247,245,242,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); padding: 10px 16px; border-bottom: 1px solid var(--line); }
    .topbar .brand-mark { font-size: 18px; }
    .topbar .menu-btn { border: 1px solid var(--line); background: #fff; border-radius: 10px; width: 42px; height: 42px; display: grid; place-items: center; cursor: pointer; }
    .view { padding: 22px 16px 56px; }
    .two-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    h1 { font-size: 25px; }
    .kpis, .kpis.three { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .kpi { padding: 14px 15px; }
    .kpi .value { font-size: 21px; }
    .kpi.feature .value { font-size: 26px; }
    .kpi.wide { grid-column: 1 / -1; }
    .form-grid, .form-grid.two { grid-template-columns: 1fr; }
    .span-2 { grid-column: auto; }
    .dl { grid-template-columns: 1fr; gap: 2px; }
    .dl dd { margin-bottom: 10px; }
    .card { padding: 16px; }
    .filters .field { min-width: 0; flex: 1 1 140px; }
    .tier-row { grid-template-columns: 1fr 1fr; }
    .tier-row .icon-btn { width: 100%; }
    .tier-row.bonus { grid-template-columns: 1fr 1fr 40px; }
    .split-row { grid-template-columns: 1fr 90px 40px; }
    .split-row .credit { grid-column: 1 / -1; order: 5; }
    .mobile-sort { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
    /* Tables become stacked cards */
    table.rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
    .rtable thead { display: none; }
    .rtable tr { border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; padding: 6px 14px; background: #fff; }
    .rtable td { display: flex; justify-content: space-between; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--line-2); text-align: right; }
    .rtable td:last-child { border-bottom: 0; }
    .rtable td::before { content: attr(data-label); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: left; flex: 0 0 auto; padding-top: 2px; }
    .rtable td[data-label=""]::before { display: none; }
    .rtable td.primary-cell { font-size: 16px; justify-content: flex-start; text-align: left; }
    .rtable td .actions { justify-content: flex-end; flex-wrap: wrap; }
    .rtable tr.total { background: var(--surface-2); }
    .table-wrap { overflow: visible; }
    /* Short two-column tables stay tables */
    table.rtable.keep { display: table; }
    .rtable.keep thead { display: table-header-group; }
    .rtable.keep tbody { display: table-row-group; }
    .rtable.keep tr { display: table-row; border: 0; padding: 0; margin: 0; background: none; }
    .rtable.keep td { display: table-cell; text-align: left; padding: 9px 6px; border-bottom: 1px solid var(--line-2); }
    .rtable.keep td.right { text-align: right; }
    .rtable.keep td::before { display: none; }
    .rtable.keep tr.highlight td { background: var(--gold-soft); }
    .statement .watermark { position: static; display: inline-block; margin-bottom: 14px; }
    .statement { padding: 26px 18px; }
    .statement .st-studio { font-size: 19px; }
    .modal-backdrop { padding: 16px 10px; }
    .modal-body, .modal-head, .modal-foot { padding-left: 18px; padding-right: 18px; }
    .page-head { align-items: flex-start; }
  }

  /* ---------- Print ---------- */
  @media print {
    body { background: #fff; }
    .sidebar, .topbar, .no-print, .toasts, .scrim { display: none !important; }
    .view { padding: 0; max-width: none; }
    .statement, .card { border: 0; box-shadow: none; padding: 0; }
    .print-only { display: block !important; }
    table.rtable { display: table; }
    .rtable thead { display: table-header-group; }
    .rtable tr { display: table-row; border: 0; padding: 0; margin: 0; }
    .rtable td { display: table-cell; text-align: inherit; }
    .rtable td::before { display: none; }
    .kpi { box-shadow: none; }
  }
  .print-only { display: none; }

  /* ---------- Time clock ---------- */
