        </button>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script>
/*
 * ClickLounge Sales Dashboard — frontend.
 * Displays data only: every amount shown comes from the server's
 * calculateCommission_(). No commission logic lives in the browser.
 */
(function () {
  'use strict';

  /* ================================================================ */
  /* State & storage                                                  */
  /* ================================================================ */
  const S = { token: null, user: null, config: {}, users: null, packages: null, dashSort: { key: 'staffName', dir: 1 } };
  const TOKEN_KEY = 'clicklounge.session';
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage unavailable */ } }
  };
  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  /* ================================================================ */
  /* Server calls                                                     */
  /* ================================================================ */
  /*
   * Two transports, same server functions:
   *  - Hosted on GitHub Pages: config.js sets window.CL_API_URL (the Apps Script
   *    /exec URL) and calls go through JSON-P, like the ClickLounge POS. JSON-P
   *    follows Apps Script's redirects on every browser, including iPhone Safari.
   *  - Served by Apps Script itself: google.script.run.
   */
  const API_URL = String(window.CL_API_URL || '').trim();
  let jsonpSeq = 0;
  function jsonp(fn, args) {
    return new Promise((resolve, reject) => {
      const cb = '__clcb_' + Date.now().toString(36) + '_' + (jsonpSeq++);
      const data = btoa(unescape(encodeURIComponent(JSON.stringify({ fn: fn, args: args }))));
      const script = document.createElement('script');
      let done = false;
      const finish = (err, res) => {
        if (done) return;
        done = true;
        clearTimeout(timer);
        window[cb] = () => {}; // a late reply after a timeout is ignored
        setTimeout(() => { script.remove(); try { delete window[cb]; } catch (e) { /* ignore */ } }, 15000);
        if (err) reject(err); else resolve(res);
      };
      // Apps Script can take a while to wake up after being idle.
      const timer = setTimeout(() => finish(new Error('The server took too long to respond. Please try again.')), 60000);
      window[cb] = (res) => finish(null, res);
      script.onerror = () => finish(new Error('Could not reach the server. Check your internet connection and try again.'));
      script.src = API_URL + (API_URL.indexOf('?') === -1 ? '?' : '&') + 'd=' + encodeURIComponent(data) + '&callback=' + cb;
      document.head.appendChild(script);
    });
  }
  function transport(fn, args) {
    if (API_URL) return jsonp(fn, args);
    if (typeof google === 'undefined' || !google.script) {
      return Promise.reject(new Error('This page is not connected to the server yet. Set the Apps Script URL in config.js (see README → GitHub Pages).'));
    }
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((err) => reject(new Error((err && err.message) || String(err))));
      runner[fn].apply(runner, args);
    });
  }
  function run(fn, args) {
    return transport(fn, args).then((res) => {
      if (!res) throw new Error('No response from the server. Please try again.');
      if (res.success) return res;
      if (res.code === 'AUTH') signedOut(res.error);
      const e = new Error(res.error || 'Request failed.');
      e.code = res.code;
      throw e;
    });
  }
  /** Calls a server function with the session token; resolves the full response. */
  const api = (fn, ...args) => run(fn, [S.token].concat(args));
  /** Same, resolving only the data. */
  const get = (fn, ...args) => api(fn, ...args).then((r) => r.data);

  /* ================================================================ */
  /* Formatting                                                       */
  /* ================================================================ */
  const esc = (s) => String(s === null || s === undefined ? '' : s)
    .replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function money(n) {
    if (n === null || n === undefined || n === '') return '—';
    const v = Number(n);
    const abs = Math.abs(v);
    const frac = Math.round(abs * 100) % 100 !== 0;
    return (v < 0 ? '-' : '') + (S.config.currencySymbol || '₱') +
      abs.toLocaleString('en-US', { minimumFractionDigits: frac ? 2 : 0, maximumFractionDigits: 2 });
  }
  const pct = (n) => (n === null || n === undefined ? '—' : (Math.round(n * 10) / 10).toLocaleString('en-US') + '%');
  const qty = (n) => (n === null || n === undefined || n === '' ? '—' : (Math.round(Number(n) * 100) / 100).toLocaleString('en-US'));
  /** 7.5 → "7h 30m" */
  function hrs(h) {
    if (h === null || h === undefined || h === '') return '—';
    const mins = Math.round(Number(h) * 60);
    const hh = Math.floor(mins / 60), mm = mins % 60;
    return hh + 'h' + (mm ? ' ' + String(mm).padStart(2, '0') + 'm' : '');
  }
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function monthLabel(m) {
    if (!m || !/^\d{4}-\d{2}$/.test(m)) return m || '';
    const [y, mo] = m.split('-').map(Number);
    return MONTHS[mo - 1] + ' ' + y;
  }
  function dateLabel(d) {
    if (!d || !/^\d{4}-\d{2}-\d{2}/.test(d)) return d || '';
    const [y, m, day] = d.slice(0, 10).split('-').map(Number);
    return MONTHS[m - 1].slice(0, 3) + ' ' + day + ', ' + y;
  }
  const shortDate = (d) => (d && /^\d{4}-\d{2}-\d{2}/.test(d) ? MONTHS[Number(d.slice(5, 7)) - 1].slice(0, 3) + ' ' + Number(d.slice(8, 10)) : '');
  function addMonths(m, n) {
    const [y, mo] = m.split('-').map(Number);
    const idx = y * 12 + (mo - 1) + n;
    return Math.floor(idx / 12) + '-' + String((idx % 12) + 1).padStart(2, '0');
  }
  function monthRange(extra) {
    const cur = S.config.currentMonth;
    const set = new Set(extra || []);
    for (let i = -12; i <= 6; i++) set.add(addMonths(cur, i));
    return Array.from(set).filter(Boolean).sort().reverse();
  }
  function monthOptions(selected, list, allLabel) {
    return (allLabel !== undefined ? '<option value="">' + esc(allLabel) + '</option>' : '') +
      list.map((m) => '<option value="' + m + '"' + (m === selected ? ' selected' : '') + '>' + monthLabel(m) + '</option>').join('');
  }
  const statusClass = (s) => (s === 'Pending Approval' ? 'Pending' : s);
  const badge = (s) => '<span class="badge ' + esc(statusClass(s)) + '">' + esc(s) + '</span>';
  const yesNo = (b, yes, no) => '<span class="badge ' + (b ? 'yes' : 'no') + '">' + (b ? (yes || 'Yes') : (no || 'No')) + '</span>';
  const progressBar = (p, cls) => '<div class="progress ' + (cls || '') + (p >= 100 ? ' done' : '') + '"><span style="width:' +
    Math.max(0, Math.min(100, Number(p) || 0)) + '%"></span></div>';

  const ICONS = {
    grid: 'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
    receipt: 'M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6',
    users: 'M16 19v-1a4 4 0 00-4-4H7a4 4 0 00-4 4v1M9.5 10a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM21 19v-1a4 4 0 00-3-3.87M16 3.13a3.5 3.5 0 010 6.75',
    calendar: 'M4 6h16v14H4zM4 10h16M9 3v4M15 3v4',
    percent: 'M19 5L5 19M7.5 9a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM16.5 18a1.5 1.5 0 100-3 1.5 1.5 0 000 3z',
    box: 'M21 8l-9-5-9 5 9 5 9-5zM3 8v8l9 5 9-5V8M12 13v8',
    chart: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
    shield: 'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z',
    gear: 'M12 15a3 3 0 100-6 3 3 0 000 6zM19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z',
    clock: 'M12 21a9 9 0 100-18 9 9 0 000 18zM12 7v5l3 2',
    timer: 'M12 22a8 8 0 100-16 8 8 0 000 16zM12 10v4l2.5 1.5M9 2h6M12 2v4',
    plus: 'M12 5v14M5 12h14',
    trash: 'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
    print: 'M6 9V3h12v6M6 18H4v-6h16v6h-2M6 14h12v7H6z',
    download: 'M12 3v12M7 10l5 5 5-5M5 21h14'
  };
  const icon = (name) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + ICONS[name] + '"/></svg>';

  /* ================================================================ */
  /* UI primitives: toast, modal, confirm, tables                     */
  /* ================================================================ */
  function toast(msg, type) {
    const el = document.createElement('div');
    el.className = 'toast' + (type === 'error' ? ' error' : '');
    el.textContent = msg;
    $('#toasts').appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .3s'; }, type === 'error' ? 5200 : 2800);
    setTimeout(() => el.remove(), type === 'error' ? 5600 : 3200);
  }

  /**
   * Opens a modal with a form. onSubmit(values, form) may return a promise;
   * a rejected promise shows its message inside the modal.
   */
  function modal(opts) {
    const root = $('#modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = '<form class="modal' + (opts.wide ? ' wide' : '') + '" novalidate>' +
      '<div class="modal-head"><h2>' + esc(opts.title) + '</h2><button type="button" class="close-x" aria-label="Close">×</button></div>' +
      '<div class="modal-body">' + opts.body + '<div class="form-error" hidden></div></div>' +
      '<div class="modal-foot">' + (opts.hideCancel ? '' : '<button type="button" class="btn cancel">' + esc(opts.cancelLabel || 'Cancel') + '</button>') +
      (opts.onSubmit ? '<button type="submit" class="btn ' + (opts.danger ? 'danger solid' : 'primary') + '">' + esc(opts.submitLabel || 'Save') + '</button>' : '') +
      '</div></form>';
    root.appendChild(wrap);
    const form = $('form', wrap);
    const errBox = $('.form-error', wrap);
    const close = () => { wrap.remove(); document.removeEventListener('keydown', onKey); if (opts.onClose) opts.onClose(); };
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    $('.close-x', wrap).onclick = close;
    const cancel = $('.cancel', wrap);
    if (cancel) cancel.onclick = close;
    wrap.addEventListener('mousedown', (e) => { if (e.target === wrap) close(); });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      if (!opts.onSubmit) return close();
      errBox.hidden = true;
      const btn = $('button[type=submit]', form);
      btn.disabled = true;
      Promise.resolve()
        .then(() => opts.onSubmit(formValues(form), form))
        .then((keepOpen) => { if (keepOpen !== true) close(); })
        .catch((err) => {
          errBox.textContent = err.message;
          errBox.hidden = false;
          errBox.scrollIntoView({ block: 'nearest' });
        })
        .finally(() => { btn.disabled = false; });
    });
    const first = $('input:not([type=hidden]):not([readonly]), select, textarea', form);
    if (first && !opts.noAutofocus) setTimeout(() => first.focus(), 30);
    if (opts.onOpen) opts.onOpen(form);
    return { close, form };
  }

  /** Confirmation dialog. Resolves { reason } when confirmed, null when cancelled. */
  function confirmBox(opts) {
    return new Promise((resolve) => {
      let done = false;
      modal({
        title: opts.title || 'Please confirm',
        body: '<p style="margin:0">' + opts.message + '</p>' +
          (opts.reasonLabel ? '<div class="field"><label>' + esc(opts.reasonLabel) + '</label><textarea name="reason" required></textarea></div>' : ''),
        submitLabel: opts.confirmLabel || 'Confirm',
        danger: !!opts.danger,
        noAutofocus: !opts.reasonLabel,
        onSubmit: (v) => {
          if (opts.reasonLabel && String(v.reason || '').trim().length < 5) throw new Error('Please enter a reason (at least 5 characters).');
          done = true;
          resolve({ reason: v.reason || '' });
        },
        onClose: () => { if (!done) resolve(null); }
      });
    });
  }

  /** Reads named form controls into an object (checkboxes → booleans). */
  function formValues(form) {
    const out = {};
    $$('[name]', form).forEach((el) => {
      if (el.closest('[data-skip]')) return;
      if (el.type === 'checkbox') out[el.name] = el.checked;
      else if (el.type === 'radio') { if (el.checked) out[el.name] = el.value; }
      else out[el.name] = el.value;
    });
    return out;
  }

  /**
   * Responsive table. columns: [{ key, label, right, render(row), sortable, primary }].
   * On phones each row becomes a card (labels come from data-label).
   */
  function table(columns, rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<div class="empty"><div class="big">' + esc(opts.emptyTitle || 'Nothing here yet') + '</div>' + (opts.empty || '') + '</div>';
    const sort = opts.sort;
    const head = '<thead><tr>' + columns.map((c) => {
      const active = sort && sort.key === c.key;
      return '<th class="' + (c.right ? 'right ' : '') + (c.sortable ? 'sortable' : '') + '" ' + (c.sortable ? 'data-sort="' + c.key + '"' : '') + '>' +
        esc(c.label) + (active ? '<span class="arrow">' + (sort.dir > 0 ? '▲' : '▼') + '</span>' : '') + '</th>';
    }).join('') + '</tr></thead>';
    const body = rows.map((r) => '<tr class="' + (opts.rowClass ? opts.rowClass(r) : '') + (opts.rowLink ? ' clickable' : '') + '"' +
      (opts.rowLink ? ' data-href="' + esc(opts.rowLink(r)) + '"' : '') + '>' +
      columns.map((c) => '<td data-label="' + esc(c.primary ? '' : c.label) + '" class="' + (c.right ? 'right num ' : '') + (c.primary ? 'primary-cell' : '') + '">' +
        (c.render ? c.render(r) : esc(r[c.key])) + '</td>').join('') + '</tr>').join('');
    const foot = opts.footer ? '<tr class="total">' + columns.map((c) => '<td data-label="' + esc(c.primary ? '' : c.label) + '" class="' + (c.right ? 'right num' : '') + '">' + (opts.footer[c.key] !== undefined ? opts.footer[c.key] : '') + '</td>').join('') + '</tr>' : '';
    return '<div class="table-wrap"><table class="rtable' + (opts.keep ? ' keep' : '') + '">' + head + '<tbody>' + body + foot + '</tbody></table></div>';
  }

  /** Wires clickable rows (ignores clicks on buttons/links inside). */
  function bindRowLinks(root) {
    $$('tr[data-href]', root).forEach((tr) => {
      tr.addEventListener('click', (e) => {
        if (e.target.closest('button, a, input, select')) return;
        location.hash = tr.getAttribute('data-href');
      });
    });
  }

  function setView(html) {
    const v = $('#view');
    v.innerHTML = html;
    return v;
  }
  const loadingHtml = '<div class="empty"><div class="spinner"></div></div>';
  function errorView(err) {
    setView('<div class="alert bad"><div class="grow"><strong>Could not load this page.</strong><br>' + esc(err.message) +
      '</div></div><button class="btn" onclick="location.reload()">Reload</button>');
  }
  function pageHead(eyebrow, title, right) {
    return '<div class="page-head"><div><div class="eyebrow">' + esc(eyebrow) + '</div><h1>' + esc(title) + '</h1></div>' +
      '<div class="toolbar no-print">' + (right || '') + '</div></div>';
  }
  function kpi(label, value, hint, cls) {
    return '<div class="kpi ' + (cls || '') + '"><div class="label">' + esc(label) + '</div><div class="value">' + value + '</div>' +
      (hint ? '<div class="hint">' + hint + '</div>' : '') + '</div>';
  }
  function withBusy(btn, promise) {
    if (btn) btn.disabled = true;
    return promise.finally(() => { if (btn) btn.disabled = false; });
  }
  function fail(err) { toast(err.message, 'error'); }

  /* ================================================================ */
  /* Cached lookups                                                   */
  /* ================================================================ */
  async function loadUsers(force) {
    if (!S.users || force) S.users = await get('listUsers');
    return S.users;
  }
  async function loadPackages(force) {
    if (!S.packages || force) S.packages = await get('listPackages', true);
    return S.packages;
  }
  const staffOptions = (users, selected, includeIds) => users
    .filter((u) => u.Status === 'Active' || (includeIds || []).indexOf(u.UserID) !== -1)
    .map((u) => '<option value="' + esc(u.UserID) + '"' + (u.UserID === selected ? ' selected' : '') + '>' + esc(u.Name) +
      (u.Status !== 'Active' ? ' (inactive)' : '') + '</option>').join('');

  /* ================================================================ */
  /* Routing & shell                                                  */
  /* ================================================================ */
  const ADMIN_NAV = [['dashboard', 'Dashboard', 'grid'], ['sales', 'Sales', 'receipt'], ['time', 'Time', 'timer'], ['staff', 'Staff', 'users'],
    ['schedules', 'Monthly Schedules', 'calendar'], ['rules', 'Commission Rules', 'percent'], ['packages', 'Packages', 'box'],
    ['reports', 'Reports', 'chart'], ['audit', 'Audit Log', 'shield'], ['settings', 'Settings', 'gear']];
  const STAFF_NAV = [['home', 'My Dashboard', 'grid'], ['time', 'Time Clock', 'timer'], ['my-sales', 'My Sales', 'receipt'], ['my-schedule', 'My Monthly Schedule', 'calendar'],
    ['my-commission', 'My Commission', 'percent'], ['history', 'History', 'clock']];

  const ADMIN_ROUTES = {
    dashboard: viewAdminDashboard, sales: viewSales, time: viewTimeAdmin, staff: viewStaff, schedules: viewSchedules,
    schedule: viewScheduleDetail, 'schedule-edit': viewScheduleEdit, rules: viewRules, packages: viewPackages,
    reports: viewReports, audit: viewAudit, settings: viewSettings, statement: viewStatement
  };
  const STAFF_ROUTES = {
    home: viewMyDashboard, time: viewTimeClock, 'my-sales': viewMySales, 'my-schedule': viewMySchedule,
    'my-commission': viewMyCommission, history: viewHistory, statement: viewStatement
  };
  const NAV_PARENT = { schedule: 'schedules', 'schedule-edit': 'schedules', statement: null };

  function renderShell() {
    const nav = S.user.isAdmin ? ADMIN_NAV : STAFF_NAV;
    $('#nav').innerHTML = nav.map((n) => '<a href="#/' + n[0] + '" data-route="' + n[0] + '">' + icon(n[2]) + '<span>' + esc(n[1]) + '</span></a>').join('');
    $('#side-name').textContent = S.user.name;
    $('#side-role').textContent = S.user.isAdmin ? 'Admin' : (S.user.position || 'Staff');
    $('#side-studio').textContent = S.config.studioName || 'Sales Dashboard';
    document.title = (S.config.studioName || 'ClickLounge') + ' · Sales Dashboard';
    $('#boot').hidden = true;
    $('#login').hidden = true;
    $('#shell').hidden = false;
  }

  function route() {
    if (!S.user) return;
    const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const routes = S.user.isAdmin ? ADMIN_ROUTES : STAFF_ROUTES;
    const home = S.user.isAdmin ? 'dashboard' : 'home';
    let name = parts[0] || home;
    let args = parts.slice(1);
    if (!routes[name]) {
      // e.g. an admin page address left over from a previous sign-in on this device.
      name = home;
      args = [];
      try { history.replaceState(null, '', location.href.split('#')[0] + '#/' + home); } catch (e) { /* cosmetic only */ }
    }
    const navKey = NAV_PARENT[name] !== undefined ? NAV_PARENT[name] : name;
    $$('#nav a').forEach((a) => a.classList.toggle('active', a.getAttribute('data-route') === navKey));
    document.body.classList.remove('nav-open');
    setView(loadingHtml);
    window.scrollTo(0, 0);
    Promise.resolve().then(() => routes[name].apply(null, args)).catch(errorView);
  }
  const go = (hash) => { if (location.hash === '#/' + hash) route(); else location.hash = '#/' + hash; };

  /* ================================================================ */
  /* Auth                                                             */
  /* ================================================================ */
  function showLogin(message) {
    $('#boot').hidden = true;
    $('#shell').hidden = true;
    $('#login').hidden = false;
    $('#login-studio').textContent = S.config.studioName || 'Sales Dashboard';
    const err = $('#login-error');
    err.hidden = !message;
    err.textContent = message || '';
  }
  function signedOut(message) {
    stopCheckWatcher();
    S.token = null;
    S.user = null;
    store.del(TOKEN_KEY);
    // The next person to sign in on this device starts on their own home page.
    try { if (location.hash) history.replaceState(null, '', location.href.split('#')[0]); } catch (e) { location.hash = ''; }
    $$('.modal-backdrop').forEach((m) => m.remove());
    showLogin(message);
  }
  function startApp(data) {
    S.token = data.token;
    S.user = data.user;
    S.config = data.config || S.config;
    store.set(TOKEN_KEY, S.token);
    renderShell();
    route();
    if (!S.user.isAdmin) startCheckWatcher();
  }

  $('#login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const btn = $('button[type=submit]', e.target);
    const email = $('#login-email').value.trim();
    const code = $('#login-code').value;
    $('#login-error').hidden = true;
    withBusy(btn, run('login', [email, code]))
      .then((res) => { $('#login-code').value = ''; startApp(res.data); })
      .catch((err) => { const el = $('#login-error'); el.textContent = err.message; el.hidden = false; });
  });
  $('#logout-link').addEventListener('click', (e) => {
    e.preventDefault();
    const token = S.token;
    signedOut('');
    run('logout', [token]).catch(() => {});
  });
  $('#change-code-link').addEventListener('click', (e) => {
    e.preventDefault();
    modal({
      title: 'Change access code',
      body: '<p class="muted small" style="margin:0">Your access code lets you sign in when Google does not share your email with the app (for example on personal Gmail accounts).</p>' +
        '<div class="field"><label>Current access code</label><input type="password" name="current" autocomplete="current-password"><span class="help">Leave blank if you have never had one.</span></div>' +
        '<div class="field"><label>New access code</label><input type="password" name="next" autocomplete="new-password" minlength="6"></div>' +
        '<div class="field"><label>Repeat new access code</label><input type="password" name="repeat" autocomplete="new-password"></div>',
      submitLabel: 'Update code',
      onSubmit: (v) => {
        if (v.next !== v.repeat) throw new Error('The new codes do not match.');
        return api('changeMyAccessCode', v.current, v.next).then((r) => toast(r.message));
      }
    });
  });
  $('#menu-btn').addEventListener('click', () => document.body.classList.toggle('nav-open'));
  $('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
  window.addEventListener('hashchange', route);

  /* ================================================================ */
  /* Shared renderers (schedule details, tiers, statement)            */
  /* ================================================================ */
  function tierRangeLabel(t) {
    return t.MaxSales === null || t.MaxSales === '' || t.MaxSales === undefined
      ? money(t.MinSales) + ' and above' : money(t.MinSales) + ' – ' + money(t.MaxSales);
  }
  function tiersTable(tiers, calc) {
    const sorted = tiers.slice().sort((a, b) => a.MinSales - b.MinSales);
    return table([
      { key: 'range', label: 'Sales range', render: tierRangeLabel },
      { key: 'rate', label: 'Commission', right: true, render: (t) => t.CommissionType === 'FIXED' ? money(t.Rate) + ' fixed' : pct(t.Rate) + ' of sales' }
    ], sorted, {
      emptyTitle: 'No commission tiers',
      keep: true,
      rowClass: (t) => (calc && sorted.indexOf(t) === calc.commissionTierIndex ? 'highlight' : '')
    });
  }
  function bonusTable(bonusTiers, calc) {
    const sorted = bonusTiers.slice().sort((a, b) => a.MinPackages - b.MinPackages);
    const reachedIdx = calc ? sorted.map((b, i) => (calc.packageCount >= b.MinPackages ? i : -1)).filter((i) => i >= 0) : [];
    const top = reachedIdx.length ? reachedIdx[reachedIdx.length - 1] : -1;
    return table([
      { key: 'MinPackages', label: 'Packages sold', render: (b) => qty(b.MinPackages) + '+ packages' },
      { key: 'BonusAmount', label: 'Bonus', right: true, render: (b) => money(b.BonusAmount) }
    ], sorted, {
      emptyTitle: 'No bonus tiers this month',
      keep: true,
      rowClass: (b) => {
        const i = sorted.indexOf(b);
        if (!calc) return '';
        return (calc.bonusStructure === 'CUMULATIVE' ? reachedIdx.indexOf(i) !== -1 : i === top) ? 'highlight' : '';
      }
    });
  }
  const STRUCTURE_LABEL = {
    TIERED_WHOLE: 'The rate of the tier reached applies to all sales',
    TIERED_PROGRESSIVE: 'Progressive: each rate applies only to sales within its tier'
  };
  const BONUS_LABEL = { HIGHEST: 'Highest applicable bonus only', CUMULATIVE: 'Cumulative: all reached bonuses are added' };

  /** KPI cards for one schedule's calculation (used by admin & staff). */
  function calcCards(c, forStaff) {
    const my = forStaff ? 'My ' : '';
    const remaining = c.targetExceeded
      ? kpi('Target exceeded', '+' + money(c.amountAboveTarget), 'Above the ' + money(c.salesTarget) + ' target', 'gold')
      : c.targetReached ? kpi('Target reached', money(0), 'Sales target met', 'gold')
        : kpi('Sales remaining', money(c.remainingSales), 'To reach ' + money(c.salesTarget));
    const next = [];
    if (c.nextCommissionTier) {
      next.push(money(c.nextCommissionTier.salesNeeded) + ' more sales to reach the ' +
        (c.nextCommissionTier.type === 'FIXED' ? money(c.nextCommissionTier.rate) + ' fixed' : pct(c.nextCommissionTier.rate)) + ' tier');
    }
    if (c.nextBonus) next.push(qty(c.nextBonus.packagesNeeded) + ' more package(s) for the ' + money(c.nextBonus.amount) + ' bonus');
    const est = c.isEstimate ? 'Estimated' : 'Final';
    return '<div class="grid kpis">' +
      kpi(my + 'Monthly target', money(c.salesTarget), qty(c.packageTarget) + ' package target') +
      kpi(my + 'Sales', money(c.sales), c.saleCount + ' commissionable sale(s)' + (c.nonCommissionableSales ? ' · ' + money(c.nonCommissionableSales) + ' not counted' : '')) +
      '<div class="kpi"><div class="label">Target progress</div><div class="value">' + pct(c.salesProgress) + '</div>' + progressBar(c.salesProgress) + '</div>' +
      remaining +
      '<div class="kpi"><div class="label">Packages sold</div><div class="value">' + qty(c.packageCount) + ' <span class="muted" style="font-size:.6em">/ ' + qty(c.packageTarget) + '</span></div>' +
      progressBar(c.packageProgress, 'sm') + '<div class="hint">' + (c.packagesRemaining > 0 ? qty(c.packagesRemaining) + ' package(s) remaining' : 'Package target reached') + '</div></div>' +
      kpi((forStaff ? 'Current ' : '') + 'Commission', money(c.commissionAmount), esc(c.commissionTier)) +
      kpi((forStaff ? 'Current ' : '') + 'Bonus', money(c.bonusAmount), esc(c.bonusTier)) +
      kpi('Base', money(c.baseCompensation), c.effectiveHourlyRate !== null && c.effectiveHourlyRate !== undefined ? 'Effective ' + money(c.effectiveHourlyRate) + '/hour' : (c.baseType === 'HOURLY' ? 'Hourly' : 'Fixed monthly')) +
      hoursCard(c, forStaff) +
      (next.length ? '<div class="kpi"><div class="label">Next milestones</div><div style="margin-top:8px;display:grid;gap:6px;font-size:13.5px">' + next.map((n) => '<div>→ ' + esc(n) + '</div>').join('') + '</div></div>' : '') +
      '<div class="kpi feature wide"><div class="label">' + est + ' total</div><div class="value">' + money(c.totalCompensation) + '</div>' +
      '<div class="hint">Base ' + money(c.baseCompensation) + ' + Commission ' + money(c.commissionAmount) + ' + Bonus ' + money(c.bonusAmount) + '</div></div>' +
      '</div>';
  }

  /** Hours worked (time clock) vs the schedule's required hours. */
  function hoursCard(c, forStaff) {
    if ((c.expectedHours === null || c.expectedHours === undefined) && !c.loggedHours) return '';
    const req = c.expectedHours === null || c.expectedHours === undefined ? null : c.expectedHours;
    return '<div class="kpi"><div class="label">' + (forStaff ? 'My hours' : 'Hours worked') + '</div>' +
      '<div class="value">' + hrs(c.loggedHours || 0) + (req !== null ? ' <span class="muted" style="font-size:.6em">/ ' + hrs(req) + '</span>' : '') + '</div>' +
      (req !== null ? progressBar(c.hoursProgress, 'sm') + '<div class="hint">' + (c.hoursRemaining > 0 ? hrs(c.hoursRemaining) + ' still required' : 'Required hours met') + '</div>'
        : '<div class="hint">' + (c.timeEntries || 0) + ' time entr' + (c.timeEntries === 1 ? 'y' : 'ies') + '</div>') + '</div>';
  }

  function estimateBanner(c) {
    if (c.isEstimate) {
      return '<div class="alert warn"><div class="grow"><strong>Estimated amounts.</strong> This month is ' + esc(c.status) +
        ' — figures update as sales are recorded and become final only when the Admin approves them.</div></div>';
    }
    return '<div class="alert ok"><div class="grow"><strong>Final — ' + esc(c.status) + '.</strong> These figures are a saved historical record' +
      (c.approvedAt ? ' (approved ' + esc(dateLabel(c.approvedAt)) + (c.paidAt ? ', paid ' + esc(dateLabel(c.paidAt)) : '') + ')' : '') + ' and will not change.</div></div>';
  }

  function scheduleInfo(d) {
    const s = d.schedule;
    const c = d.calc;
    return '<dl class="dl">' +
      '<dt>Staff</dt><dd>' + esc(d.staffName) + '</dd>' +
      '<dt>Position</dt><dd>' + esc(s.Position || '—') + '</dd>' +
      '<dt>Month</dt><dd>' + esc(monthLabel(s.Month)) + '</dd>' +
      '<dt>Target period</dt><dd>' + esc(dateLabel(s.StartDate)) + ' – ' + esc(dateLabel(s.EndDate)) + '</dd>' +
      '<dt>Date issued</dt><dd>' + esc(dateLabel(s.DateIssued)) + '</dd>' +
      '<dt>Package target</dt><dd>' + qty(s.PackageTarget) + ' packages</dd>' +
      '<dt>Gross sales target</dt><dd>' + money(s.SalesTarget) + '</dd>' +
      '<dt>Additional target</dt><dd>' + esc(s.AdditionalTarget || '—') + '</dd>' +
      '<dt>Special incentives</dt><dd>' + esc(s.SpecialIncentives || '—') + '</dd>' +
      '<dt>Base compensation</dt><dd>' + (s.BaseType === 'HOURLY' ? money(s.HourlyRate) + '/hour × ' + qty(c.baseHoursUsed) + ' h = ' + money(c.baseCompensation) : money(s.BaseCompensation)) + '</dd>' +
      '<dt>Expected hours</dt><dd>' + (s.ExpectedHours !== null && s.ExpectedHours !== '' ? qty(s.ExpectedHours) + ' h' : '—') +
      (c.effectiveHourlyRate !== null && c.effectiveHourlyRate !== undefined ? ' <span class="muted">(effective ' + money(c.effectiveHourlyRate) + '/hour)</span>' : '') + '</dd>' +
      (s.ActualHours !== null && s.ActualHours !== '' && s.ActualHours !== undefined ? '<dt>Actual hours</dt><dd>' + qty(s.ActualHours) + ' h</dd>' : '') +
      '<dt>Commission structure</dt><dd>' + esc(STRUCTURE_LABEL[s.CommissionStructure] || s.CommissionStructure) + '</dd>' +
      '<dt>Bonus structure</dt><dd>' + esc(BONUS_LABEL[s.BonusStructure] || s.BonusStructure) + '</dd>' +
      (s.Notes ? '<dt>Notes</dt><dd>' + esc(s.Notes) + '</dd>' : '') +
      '</dl>';
  }

  function rulesCards(d) {
    return '<div class="two-col section">' +
      '<div class="card"><div class="card-head"><h2>Commission tiers</h2><span class="muted small">' + esc(STRUCTURE_LABEL[d.schedule.CommissionStructure] || '') + '</span></div>' + tiersTable(d.tiers, d.calc) + '</div>' +
      '<div class="card"><div class="card-head"><h2>Bonus tiers</h2><span class="muted small">' + esc(BONUS_LABEL[d.schedule.BonusStructure] || '') + '</span></div>' + bonusTable(d.bonusTiers, d.calc) + '</div>' +
      '</div>';
  }

  /* ================================================================ */
  /* ADMIN: Dashboard                                                 */
  /* ================================================================ */
  async function viewAdminDashboard(month) {
    const d = await get('getAdminDashboard', month || '');
    const months = monthRange(d.months);
    const t = d.totals;
    const v = setView(
      pageHead('Dashboard', d.monthLabel,
        '<select id="dash-month" aria-label="Month">' + monthOptions(d.month, months) + '</select>' +
        '<button class="btn gold" id="dash-sale">' + icon('plus') + 'Record sale</button>') +
      (d.pendingApproval ? '<div class="alert warn"><div class="grow"><strong>' + d.pendingApproval + ' schedule(s) awaiting approval.</strong> Check the sales, then approve.</div><a class="btn sm" href="#/schedules/all/Pending Approval">Review</a></div>' : '') +
      (d.clockedIn && d.clockedIn.length ? '<div class="alert ok"><div class="grow"><strong>Clocked in now:</strong> ' +
        d.clockedIn.map((c) => esc(c.staffName) + ' <span class="muted">(since ' + esc(c.since) + (c.date !== S.config.today ? ', ' + esc(dateLabel(c.date)) : '') + (c.onBreak ? ', on break' : '') + ')</span>' +
          (c.missedChecks ? ' <span class="badge no">' + c.missedChecks + ' missed check' + (c.missedChecks === 1 ? '' : 's') + '</span>' : '')).join(', ') +
        '</div><a class="btn sm" href="#/time">Time</a></div>' : '') +
      (d.staffWithoutSchedule.length ? '<div class="alert info"><div class="grow">No ' + esc(d.monthLabel) + ' schedule yet for: <strong>' +
        d.staffWithoutSchedule.map((u) => esc(u.name)).join(', ') + '</strong>.</div><a class="btn sm" href="#/schedules">Create schedules</a></div>' : '') +
      '<div class="grid kpis">' +
      kpi('Studio sales', money(t.sales), 'Commissionable, all staff') +
      '<div class="kpi"><div class="label">Combined target</div><div class="value">' + money(t.salesTarget) + '</div>' + progressBar(t.salesTarget ? t.sales / t.salesTarget * 100 : 0, 'sm') +
      '<div class="hint">' + pct(t.salesTarget ? Math.round(t.sales / t.salesTarget * 1000) / 10 : null) + ' reached</div></div>' +
      kpi('Packages sold', qty(t.packageCount)) +
      kpi('Commission', money(t.commissionAmount)) +
      kpi('Bonus', money(t.bonusAmount)) +
      kpi('Base compensation', money(t.baseCompensation)) +
      '<div class="kpi feature wide"><div class="label">Total compensation</div><div class="value">' + money(t.totalCompensation) + '</div>' +
      '<div class="hint">Base + Commission + Bonus · ' + d.rows.length + ' schedule(s), ' + d.rows.filter((r) => r.locked).length + ' finalized</div></div>' +
      '</div>' +
      '<div class="card section" style="margin-top:18px"><div class="card-head"><h2>Staff performance</h2><span class="muted small">Click a row for details</span></div>' +
      '<div class="mobile-sort"><label class="label-sm" for="dash-sort">Sort by</label><select id="dash-sort"></select></div>' +
      '<div id="dash-table"></div></div>');

    const cols = [
      { key: 'staffName', label: 'Staff', sortable: true, primary: true, render: (r) => '<div class="cell-strong">' + esc(r.staffName) + '</div><div class="cell-sub">' + esc(r.position || '') + '</div>' },
      { key: 'sales', label: 'Sales', right: true, sortable: true, render: (r) => money(r.sales) },
      { key: 'salesTarget', label: 'Target', right: true, sortable: true, render: (r) => money(r.salesTarget) },
      { key: 'salesProgress', label: 'Progress', right: true, sortable: true, render: (r) => pct(r.salesProgress) + progressBar(r.salesProgress, 'sm') },
      { key: 'packageCount', label: 'Packages', right: true, sortable: true, render: (r) => qty(r.packageCount) + ' / ' + qty(r.packageTarget) },
      { key: 'loggedHours', label: 'Hours', right: true, sortable: true, render: (r) => '<span class="nowrap">' + hrs(r.loggedHours || 0) + (r.expectedHours ? ' / ' + hrs(r.expectedHours) : '') + '</span>' },
      { key: 'commissionAmount', label: 'Commission', right: true, sortable: true, render: (r) => money(r.commissionAmount) },
      { key: 'bonusAmount', label: 'Bonus', right: true, sortable: true, render: (r) => money(r.bonusAmount) },
      { key: 'totalCompensation', label: 'Total', right: true, sortable: true, render: (r) => '<strong>' + money(r.totalCompensation) + '</strong>' },
      { key: 'status', label: 'Status', render: (r) => badge(r.status) }
    ];
    const sortSel = $('#dash-sort', v);
    sortSel.innerHTML = cols.filter((c) => c.sortable).map((c) => '<option value="' + c.key + '">' + esc(c.label) + '</option>').join('');
    const draw = () => {
      const { key, dir } = S.dashSort;
      const rows = d.rows.slice().sort((a, b) => {
        const x = a[key], y = b[key];
        return (typeof x === 'string' ? String(x).localeCompare(y) : (Number(x) || 0) - (Number(y) || 0)) * dir;
      });
      $('#dash-table', v).innerHTML = table(cols, rows, {
        sort: S.dashSort,
        rowLink: (r) => '#/schedule/' + r.scheduleId,
        emptyTitle: 'No schedules for ' + d.monthLabel,
        empty: '<p>Create a monthly schedule for each staff member, or copy last month\'s.</p><a class="btn primary" href="#/schedules">Go to Monthly Schedules</a>'
      });
      sortSel.value = key;
      $$('th[data-sort]', v).forEach((th) => th.addEventListener('click', () => {
        const k = th.getAttribute('data-sort');
        S.dashSort = { key: k, dir: S.dashSort.key === k ? -S.dashSort.dir : 1 };
        draw();
      }));
      bindRowLinks(v);
    };
    sortSel.addEventListener('change', () => { S.dashSort = { key: sortSel.value, dir: sortSel.value === 'staffName' ? 1 : -1 }; draw(); });
    draw();
    $('#dash-month', v).addEventListener('change', (e) => go('dashboard/' + e.target.value));
    $('#dash-sale', v).addEventListener('click', () => openSaleForm(null, () => route()));
  }

  /* ================================================================ */
  /* ADMIN: Sales                                                     */
  /* ================================================================ */
  async function viewSales(month, staffId) {
    month = month === 'all' ? '' : (month || S.config.currentMonth);
    staffId = staffId || '';
    const [users, data] = await Promise.all([loadUsers(), get('listSales', { month: month, staffId: staffId })]);
    const v = setView(pageHead('Sales', 'Sales entries', '<button class="btn gold" id="add-sale">' + icon('plus') + 'Record sale</button>') +
      '<div class="filters no-print">' +
      '<div class="field"><label>Month</label><select id="f-month">' + monthOptions(month, monthRange(), 'All months') + '</select></div>' +
      '<div class="field"><label>Staff</label><select id="f-staff"><option value="">All staff</option>' + staffOptions(users, staffId, users.map((u) => u.UserID)) + '</select></div>' +
      '</div>' +
      '<div class="grid kpis three" style="margin-bottom:18px">' +
      kpi('Sales recorded', String(data.totals.count)) +
      kpi('Total final amount', money(data.totals.final)) +
      kpi('Commissionable', money(data.totals.commissionable), esc(S.config.commissionBasisLabel || '')) +
      '</div>' +
      '<div class="card">' + table([
        { key: 'SaleDate', label: 'Date', render: (s) => '<span class="nowrap">' + esc(dateLabel(s.SaleDate)) + '</span>' },
        { key: 'ClientName', label: 'Client', primary: true, render: (s) => '<div class="cell-strong">' + esc(s.ClientName) + '</div><div class="cell-sub">' + esc(s.ClientContact || '') + '</div>' },
        { key: 'PackageName', label: 'Package', render: (s) => esc(s.PackageName) + (s.Discount ? '<div class="cell-sub">' + money(s.GrossPrice) + ' − ' + money(s.Discount) + '</div>' : '') },
        { key: 'attribution', label: 'Credited to', render: (s) => esc(s.attribution) + (s.SharedSale ? ' <span class="badge">Shared</span>' : '') },
        { key: 'FinalPaidAmount', label: 'Final amount', right: true, render: (s) => '<strong>' + money(s.FinalPaidAmount) + '</strong>' },
        { key: 'status', label: 'Status', render: (s) => '<div class="small">' + esc(s.PaymentStatus) + ' · ' + esc(s.BookingStatus) + '</div>' },
        { key: 'isCommissionable', label: 'Counts', render: (s) => yesNo(s.isCommissionable, 'Counts', 'Not counted') },
        { key: 'actions', label: '', render: (s) => '<div class="actions one-line"><button class="btn sm" data-edit="' + esc(s.SaleID) + '">Edit</button><button class="btn sm danger" data-del="' + esc(s.SaleID) + '">Delete</button></div>' }
      ], data.sales, { emptyTitle: 'No sales recorded', empty: '<p>Record the first sale for this period.</p>' }) + '</div>');

    const refilter = () => go('sales/' + ($('#f-month').value || 'all') + ($('#f-staff').value ? '/' + $('#f-staff').value : ''));
    $('#f-month', v).addEventListener('change', refilter);

  /** Sale entry form (create / edit), with single or shared attribution. */
  async function openSaleForm(sale, after) {
    const [users, packages] = await Promise.all([loadUsers(), loadPackages()]);
    const s = sale || { SaleDate: S.config.today, PaymentStatus: 'Paid', BookingStatus: 'Confirmed', Commissionable: 'AUTO', Discount: 0 };
    const credited = sale ? (sale.SharedSale ? sale.splits.map((x) => x.StaffID) : [sale.StaffID]) : [];
    const pkgOpts = packages.filter((p) => p.Active || (sale && p.PackageID === sale.PackageID))
      .map((p) => '<option value="' + esc(p.PackageID) + '" data-price="' + p.Price + '"' + (p.PackageID === s.PackageID ? ' selected' : '') + '>' +
        esc(p.PackageName) + ' — ' + money(p.Price) + (p.Active ? '' : ' (disabled)') + '</option>').join('');
    const opt = (list, sel) => list.map((x) => '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>').join('');
    const splitRow = (sp) => '<div class="split-row"><div class="field"><label>Staff</label><select class="sp-staff"><option value="">Choose…</option>' +
      staffOptions(users, sp.StaffID, credited) + '</select></div>' +
      '<div class="field"><label>Share %</label><input class="sp-pct" type="number" min="0" max="100" step="0.01" inputmode="decimal" value="' + esc(sp.Percentage === undefined ? '' : sp.Percentage) + '"></div>' +
      '<div class="field credit"><label>Credited</label><input class="sp-credit" readonly tabindex="-1"></div>' +
      '<button type="button" class="icon-btn sp-del" aria-label="Remove">' + icon('trash') + '</button></div>';
    const splits = sale && sale.SharedSale ? sale.splits : [{ StaffID: '', Percentage: 50 }, { StaffID: '', Percentage: 50 }];

    modal({
      title: sale ? 'Edit sale' : 'Record a sale',
      wide: true,
      submitLabel: sale ? 'Save changes' : 'Save sale',
      body:
        '<div class="form-grid">' +
        '<div class="field"><label>Sale date</label><input type="date" name="SaleDate" value="' + esc(s.SaleDate) + '" required></div>' +
        '<div class="field"><label>Client name</label><input name="ClientName" value="' + esc(s.ClientName || '') + '" required></div>' +
        '<div class="field"><label>Client contact</label><input name="ClientContact" value="' + esc(s.ClientContact || '') + '" placeholder="Mobile or email"></div>' +
        '<div class="field span-2"><label>Package</label><select name="PackageID" id="sf-pkg" required><option value="">Choose a package…</option>' + pkgOpts + '</select></div>' +
        '<div class="field"><label>Package price</label><input name="GrossPrice" id="sf-gross" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(s.GrossPrice === undefined ? '' : s.GrossPrice) + '"></div>' +
        '<div class="field"><label>Discount</label><input name="Discount" id="sf-disc" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(s.Discount || 0) + '"></div>' +
        '<div class="field"><label>Final paid amount</label><input name="FinalPaidAmount" id="sf-final" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(s.FinalPaidAmount === undefined ? '' : s.FinalPaidAmount) + '"><span class="help">Defaults to price − discount.</span></div>' +
        '<div class="field"><label>Commission</label><select name="Commissionable">' +
        [['AUTO', 'Follow the commission rules'], ['YES', 'Always count this sale'], ['NO', 'Never count this sale']].map((o) => '<option value="' + o[0] + '"' + (o[0] === s.Commissionable ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>' +
        '<div class="field"><label>Payment status</label><select name="PaymentStatus">' + opt(S.config.paymentStatuses, s.PaymentStatus) + '</select></div>' +
        '<div class="field"><label>Booking status</label><select name="BookingStatus">' + opt(S.config.bookingStatuses, s.BookingStatus) + '</select></div>' +
        '</div>' +
        '<div class="form-section"><h2>Sales attribution</h2><p>Every sale must be credited to the staff member who made it. Shared sales are split by the percentages you enter.</p>' +
        '<div class="segmented" style="margin-bottom:14px"><label><input type="radio" name="attr" value="single"' + (s.SharedSale ? '' : ' checked') + '>Single staff</label>' +
        '<label><input type="radio" name="attr" value="shared"' + (s.SharedSale ? ' checked' : '') + '>Shared between staff</label></div>' +
        '<div id="sf-single"><div class="field"><label>Staff member</label><select name="StaffID"><option value="">Choose…</option>' + staffOptions(users, s.SharedSale ? '' : s.StaffID, credited) + '</select></div></div>' +
        '<div id="sf-shared" data-skip><div id="sf-splits">' + splits.map(splitRow).join('') + '</div>' +
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><button type="button" class="btn sm" id="sf-add-split">' + icon('plus') + 'Add staff</button><span class="split-total" id="sf-total"></span></div></div>' +
        '</div>' +
        '<div class="field"><label>Notes</label><textarea name="Notes">' + esc(s.Notes || '') + '</textarea></div>',
      onOpen: (form) => {
        const gross = $('#sf-gross', form), disc = $('#sf-disc', form), fin = $('#sf-final', form), pkg = $('#sf-pkg', form);
        let finalTouched = !!sale && Number(sale.FinalPaidAmount) !== Math.round((Number(sale.GrossPrice) - Number(sale.Discount)) * 100) / 100;
        const syncFinal = () => {
          if (!finalTouched) fin.value = gross.value === '' ? '' : Math.max(0, Math.round(((Number(gross.value) || 0) - (Number(disc.value) || 0)) * 100) / 100);
          updateSplits();
        };
        pkg.addEventListener('change', () => { const o = pkg.selectedOptions[0]; if (o && o.dataset.price) gross.value = o.dataset.price; syncFinal(); });
        gross.addEventListener('input', syncFinal);
        disc.addEventListener('input', syncFinal);
        fin.addEventListener('input', () => { finalTouched = true; updateSplits(); });
        const toggle = () => {
          const shared = $('input[name=attr]:checked', form).value === 'shared';
          $('#sf-single', form).hidden = shared;
          $('#sf-shared', form).hidden = !shared;
        };
        $$('input[name=attr]', form).forEach((r) => r.addEventListener('change', toggle));
        function updateSplits() {
          const amount = Number(fin.value) || 0;
          let total = 0;
          $$('.split-row', form).forEach((row) => {
            const p = Number($('.sp-pct', row).value) || 0;
            total += p;
            $('.sp-credit', row).value = money(amount * p / 100);
          });
          total = Math.round(total * 100) / 100;
          const el = $('#sf-total', form);
          el.textContent = 'Total: ' + total + '%' + (total === 100 ? ' ✓' : ' (must be 100%)');
          el.style.color = total === 100 ? 'var(--ok)' : 'var(--bad)';
        }
        const bindRow = (row) => {
          $('.sp-pct', row).addEventListener('input', updateSplits);
          $('.sp-del', row).addEventListener('click', () => { row.remove(); updateSplits(); });
        };
        $$('.split-row', form).forEach(bindRow);
        $('#sf-add-split', form).addEventListener('click', () => {
          $('#sf-splits', form).insertAdjacentHTML('beforeend', splitRow({ StaffID: '', Percentage: '' }));
          bindRow($('#sf-splits .split-row:last-child', form));
          updateSplits();
        });
        toggle();
        if (!sale) syncFinal(); else updateSplits();
      },
      onSubmit: (vals, form) => {
        const shared = vals.attr === 'shared';
        const payload = Object.assign({}, vals, { SaleID: sale ? sale.SaleID : '', SharedSale: shared });
        delete payload.attr;
        if (shared) {
          payload.Splits = $$('.split-row', form).map((row) => ({ StaffID: $('.sp-staff', row).value, Percentage: $('.sp-pct', row).value }));
          payload.StaffID = '';
        }
        return api('saveSale', payload).then((r) => { toast(r.message); if (after) after(); });
      }
    });
  }

  function scheduleActions(r) {
    const b = (act, label, cls) => '<button class="btn sm ' + (cls || '') + '" data-act="' + act + '" data-id="' + esc(r.scheduleId) + '">' + label + '</button>';
    const list = ['<a class="btn sm" href="#/schedule/' + esc(r.scheduleId) + '">View</a>'];
    if (!r.locked) list.push('<a class="btn sm" href="#/schedule-edit/' + esc(r.scheduleId) + '">Edit</a>');
    list.push(b('duplicate', 'Duplicate'));
    if (r.status === 'Draft') list.push(b('activate', 'Activate', 'primary'));
    if (r.status === 'Active' || r.status === 'Pending Approval') list.push(b('approve', 'Approve', 'gold'));
    if (r.status === 'Approved') list.push(b('markPaid', 'Mark Paid', 'primary'));
    if (r.locked) list.push(b('unlock', 'Unlock', 'danger'));
    return '<div class="actions one-line">' + list.join('') + '</div>';
  }

  function bindScheduleActions(root, rows) {
    $$('[data-act]', root).forEach((btn) => btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const id = btn.getAttribute('data-id');
      const act = btn.getAttribute('data-act');
      const row = rows.find((r) => (r.scheduleId || (r.schedule && r.schedule.ScheduleID)) === id) || {};
      if (act === 'duplicate') return openDuplicateOne(id, row.month);
      scheduleStatusAction(id, act, row, btn);
    }));
  }

  /** Confirms and runs a workflow action (approve, mark paid, unlock, ...). */
  async function scheduleStatusAction(id, act, row, btn) {
    const who = esc(row.staffName || '') + ' · ' + esc(row.monthLabel || monthLabel(row.month));
    const cfg = {
      activate: { title: 'Activate schedule?', message: 'Activate the schedule for <strong>' + who + '</strong>? The staff member will be able to see it.', confirmLabel: 'Activate' },
      revertToDraft: { title: 'Move back to Draft?', message: 'Hide this schedule from the staff member again?', confirmLabel: 'Move to Draft' },
      close: { title: 'Close month?', message: 'Move <strong>' + who + '</strong> to Pending Approval?', confirmLabel: 'Close month' },
      reopen: { title: 'Reopen schedule?', message: 'Move this schedule back to Active?', confirmLabel: 'Reopen' },
      approve: {
        title: 'Approve commission?',
        message: 'Approve <strong>' + who + '</strong>: ' + money(row.totalCompensation) + ' total (commission ' + money(row.commissionAmount) + ', bonus ' + money(row.bonusAmount) + ')?' +
          '<br><br>The figures, tiers and sales will be saved as a permanent record. Later rule changes will not affect this month.' +
          (row.status === 'Active' ? '<br><br><strong>Note:</strong> this month has not been closed yet.' : ''),
        confirmLabel: 'Approve'
      },
      markPaid: { title: 'Mark as Paid?', message: 'Confirm that <strong>' + who + '</strong> has been paid ' + money(row.totalCompensation) + '. The month will be locked.', confirmLabel: 'Mark Paid' },
      unlock: {
        title: 'Unlock for correction?',
        message: 'This schedule is <strong>' + esc(row.status) + '</strong>. Unlocking moves it back to Pending Approval so sales and rules can be corrected. The approved snapshot is kept as history. Your name, the time and the reason are recorded in the Audit Log.',
        confirmLabel: 'Unlock', danger: true, reasonLabel: 'Reason for unlocking'
      }
    }[act];
    const ok = await confirmBox(cfg);
    if (!ok) return;
    withBusy(btn, api('changeScheduleStatus', id, act, ok.reason)).then((r) => { toast(r.message); route(); }).catch(fail);
  }

  function tierEditor(host, tiers) {

      '<div class="field"><label>Minimum sales</label><input class="t-min" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(t.MinSales === null || t.MinSales === undefined ? '' : t.MinSales) + '"></div>' +
      '<div class="field"><label>Maximum sales</label><input class="t-max" type="number" min="0" step="0.01" inputmode="decimal" placeholder="No maximum" value="' + esc(t.MaxSales === null || t.MaxSales === undefined ? '' : t.MaxSales) + '"></div>' +
      '<div class="field"><label>Type</label><select class="t-type"><option value="PERCENT"' + (t.CommissionType !== 'FIXED' ? ' selected' : '') + '>Percentage</option><option value="FIXED"' + (t.CommissionType === 'FIXED' ? ' selected' : '') + '>Fixed amount</option></select></div>' +
      '<div class="field"><label class="t-rate-label">' + (t.CommissionType === 'FIXED' ? 'Amount' : 'Rate %') + '</label><input class="t-rate" type="number" min="0" step="0.01" inputmode="decimal" value="' + esc(t.Rate === undefined ? '' : t.Rate) + '"></div>' +
      '<button type="button" class="icon-btn t-del" aria-label="Delete tier">' + icon('trash') + '</button></div>';
    host.innerHTML = '<div class="t-rows">' + tiers.map(rowHtml).join('') + '</div>' +

      '<p class="muted small" style="margin:10px 0 0">Maximums are inclusive to the peso (₱69,999 covers ₱69,999.99). Leave the last maximum blank for “and above”.</p>';
    const bind = (row) => {
      $('.t-del', row).addEventListener('click', () => row.remove());
      $('.t-type', row).addEventListener('change', (e) => { $('.t-rate-label', row).textContent = e.target.value === 'FIXED' ? 'Amount' : 'Rate %'; });
    };
    $$('.tier-row', host).forEach(bind);
    $('.t-add', host).addEventListener('click', () => {
      const rows = $$('.tier-row', host);
      const last = rows[rows.length - 1];
      const nextMin = last && $('.t-max', last).value ? Number($('.t-max', last).value) + 1 : '';
      $('.t-rows', host).insertAdjacentHTML('beforeend', rowHtml({ MinSales: nextMin, MaxSales: null, CommissionType: 'PERCENT', Rate: '' }));
      bind($('.t-rows .tier-row:last-child', host));
    });
    return () => $$('.tier-row', host).map((row) => ({
      MinSales: $('.t-min', row).value, MaxSales: $('.t-max', row).value, CommissionType: $('.t-type', row).value, Rate: $('.t-rate', row).value
    }));

      '<button type="button" class="icon-btn b-del" aria-label="Delete bonus tier">' + icon('trash') + '</button></div>';

  async function viewScheduleEdit(id, presetStaff, presetMonth) {
    const isNew = !id || id === 'new';
    const users = await loadUsers();
    let s, tiers, bonusTiers;
    if (isNew) {
      const tpl = await get('getScheduleTemplate');
      const month = presetMonth || S.config.currentMonth;
      const staff = users.find((u) => u.UserID === presetStaff);
      s = {
        Month: month, StartDate: month + '-01', EndDate: lastDay(month), DateIssued: S.config.today, StaffID: presetStaff || '',
        Position: staff ? staff.Position : '', PackageTarget: tpl.packageTarget, SalesTarget: tpl.salesTarget,
        BaseType: 'FIXED', BaseCompensation: staff && staff.BaseCompensationDefault ? staff.BaseCompensationDefault : tpl.baseCompensation,
        ExpectedHours: tpl.expectedHours, CommissionStructure: tpl.commissionStructure, BonusStructure: tpl.bonusStructure, Status: 'Draft'
      };
      tiers = tpl.tiers;
      bonusTiers = tpl.bonusTiers;
    } else {
      const d = await get('getSchedule', id);
      if (d.locked) {
        setView('<div class="alert warn"><div class="grow">This schedule is <strong>' + esc(d.schedule.Status) + '</strong> and locked. Unlock it for correction from the schedule page first.</div></div><a class="btn" href="#/schedule/' + esc(id) + '">Back to schedule</a>');
        return;
      }
      s = d.schedule;
      tiers = d.tiers;
      bonusTiers = d.bonusTiers;
    }
    const val = (x) => esc(x === null || x === undefined ? '' : x);
    const v = setView(pageHead(isNew ? 'New schedule' : 'Edit schedule', isNew ? 'Monthly Sales Target & Commission Schedule' : monthLabel(s.Month) + ' schedule', '') +
      '<form id="sched-form" class="card" novalidate>' +
      '<div class="form-section"><h2>Basic information</h2><p>This schedule is the authoritative document for the month. Its targets and rules belong to this month only.</p>' +
      '<div class="form-grid">' +
      '<div class="field"><label>Staff member</label><select name="StaffID" id="sc-staff" required><option value="">Choose…</option>' + staffOptions(users, s.StaffID, [s.StaffID]) + '</select></div>' +
      '<div class="field"><label>Position</label><input name="Position" id="sc-pos" value="' + val(s.Position) + '"></div>' +
      '<div class="field"><label>Month</label><select name="Month" id="sc-month">' + monthOptions(s.Month, monthRange([s.Month])) + '</select></div>' +
      '<div class="field"><label>Target start date</label><input type="date" name="StartDate" id="sc-start" value="' + val(s.StartDate) + '"></div>' +
      '<div class="field"><label>Target end date</label><input type="date" name="EndDate" id="sc-end" value="' + val(s.EndDate) + '"></div>' +
      '<div class="field"><label>Date issued</label><input type="date" name="DateIssued" value="' + val(s.DateIssued) + '"></div>' +
      (isNew ? '<div class="field"><label>Start as</label><select name="Status"><option value="Draft">Draft (hidden from staff)</option><option value="Active">Active (visible to staff)</option></select></div>' : '') +
      '</div></div>' +
      '<div class="form-section"><h2>Sales target</h2><p>What the staff member is aiming for this month.</p><div class="form-grid">' +
      '<div class="field"><label>Package target</label><input type="number" min="0" step="1" name="PackageTarget" value="' + val(s.PackageTarget) + '"></div>' +
      '<div class="field"><label>Gross sales target</label><input type="number" min="0" step="0.01" name="SalesTarget" value="' + val(s.SalesTarget) + '"></div>' +
      '<div class="field"><label>Additional performance target</label><input name="AdditionalTarget" value="' + val(s.AdditionalTarget) + '" placeholder="e.g. At least 5 Prestige packages"></div>' +
      '<div class="field span-all"><label>Special incentives</label><textarea name="SpecialIncentives" placeholder="Optional incentives for this month">' + val(s.SpecialIncentives) + '</textarea></div>' +
      '</div></div>' +
      '<div class="form-section"><h2>Base compensation</h2><p>Configurable per staff member and month.</p><div class="form-grid">' +
      '<div class="field"><label>Type</label><select name="BaseType" id="sc-basetype"><option value="FIXED"' + (s.BaseType !== 'HOURLY' ? ' selected' : '') + '>Fixed monthly amount</option><option value="HOURLY"' + (s.BaseType === 'HOURLY' ? ' selected' : '') + '>Hourly rate × hours</option></select></div>' +
      '<div class="field"><label>Base compensation</label><input type="number" min="0" step="0.01" name="BaseCompensation" id="sc-base" value="' + val(s.BaseCompensation) + '"></div>' +
      '<div class="field"><label>Expected hours</label><input type="number" min="0" step="0.25" name="ExpectedHours" id="sc-exp" value="' + val(s.ExpectedHours) + '"></div>' +
      '<div class="field"><label>Actual hours (if applicable)</label><input type="number" min="0" step="0.25" name="ActualHours" value="' + val(s.ActualHours) + '"></div>' +
      '<div class="field"><label>Hourly rate (if applicable)</label><input type="number" min="0" step="0.01" name="HourlyRate" value="' + val(s.HourlyRate) + '"></div>' +
      '<div class="field"><label>Effective hourly rate</label><input readonly id="sc-eff" tabindex="-1"><span class="help">Base ÷ expected hours</span></div>' +
      '</div></div>' +
      '<div class="form-section"><h2>Commission tiers</h2><p>Add, edit or delete tiers for this month. Changes here never affect other months.</p>' +
      '<div class="field" style="max-width:520px;margin-bottom:8px"><label>How tiers apply</label>' + structureSelect('CommissionStructure', s.CommissionStructure) + '</div>' +
      '<div id="sc-tiers"></div></div>' +
      '<div class="form-section"><h2>Bonus tiers</h2><p>Bonuses based on packages sold.</p>' +
      '<div class="field" style="max-width:520px;margin-bottom:8px"><label>Bonus rule</label>' + bonusModeSelect('BonusStructure', s.BonusStructure) + '</div>' +
      '<div id="sc-bonus"></div></div>' +
      '<div class="form-section"><h2>Notes</h2><div class="field"><textarea name="Notes">' + val(s.Notes) + '</textarea></div>' +
      '<label class="check" style="margin-top:14px"><input type="checkbox" name="allowDuplicate">Allow a second schedule for this staff member in the same month (dates must not overlap)</label></div>' +
      '<div class="form-error" id="sc-error" hidden style="margin-top:18px"></div>' +
      '<div class="toolbar" style="margin-top:22px;justify-content:flex-end">' +
      '<a class="btn" href="' + (isNew ? '#/schedules' : '#/schedule/' + esc(s.ScheduleID)) + '">Cancel</a>' +
      '<button type="submit" class="btn primary">Save schedule</button></div>' +
      '</form>');

    const readTiers = tierEditor($('#sc-tiers', v), tiers);
    const readBonus = bonusEditor($('#sc-bonus', v), bonusTiers);
    const form = $('#sched-form', v);
    const eff = () => {
      const base = Number($('#sc-base', v).value) || 0, h = Number($('#sc-exp', v).value) || 0;
      $('#sc-eff', v).value = h > 0 && $('#sc-basetype', v).value === 'FIXED' ? money(Math.round(base / h * 100) / 100) + ' / hour' : '—';
    };
    ['#sc-base', '#sc-exp', '#sc-basetype'].forEach((x) => $(x, v).addEventListener('input', eff));
    eff();
    let prevMonth = s.Month;
    $('#sc-month', v).addEventListener('change', (e) => {
      const m = e.target.value;
      // Move the dates with the month when they still cover the whole previous month.
      if ($('#sc-start', v).value === prevMonth + '-01' && $('#sc-end', v).value === lastDay(prevMonth)) {
        $('#sc-start', v).value = m + '-01';
        $('#sc-end', v).value = lastDay(m);
      }
      prevMonth = m;
    });
    $('#sc-staff', v).addEventListener('change', (e) => {
      const u = users.find((x) => x.UserID === e.target.value);
      if (!u) return;
      if (!$('#sc-pos', v).value || isNew) $('#sc-pos', v).value = u.Position || '';
      if (isNew && u.BaseCompensationDefault) { $('#sc-base', v).value = u.BaseCompensationDefault; eff(); }
    });
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const vals = formValues(form);
      const allowDuplicate = vals.allowDuplicate;
      delete vals.allowDuplicate;
      const schedule = Object.assign({}, isNew ? {} : s, vals, { ScheduleID: isNew ? '' : s.ScheduleID });
      const errBox = $('#sc-error', v);
      errBox.hidden = true;
      withBusy($('button[type=submit]', form), api('saveSchedule', { schedule: schedule, tiers: readTiers(), bonusTiers: readBonus(), allowDuplicate: allowDuplicate }))
        .then((r) => { toast(r.message); go('schedule/' + r.data.scheduleId); })
        .catch((err) => { errBox.textContent = err.message; errBox.hidden = false; errBox.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
    });
  }
  function lastDay(m) {
    const [y, mo] = m.split('-').map(Number);
    return m + '-' + String(new Date(Date.UTC(y, mo, 0)).getUTCDate()).padStart(2, '0');
  }

  function downloadFile(name, content, type) {
    try {
      const url = URL.createObjectURL(new Blob([content], { type: type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
      toast('Downloaded ' + name);
    } catch (e) {
      modal({ title: 'Copy CSV', body: '<p class="muted small" style="margin:0">Your browser blocked the download. Copy the text below into a .csv file.</p><textarea style="min-height:240px">' + esc(content) + '</textarea>', hideCancel: false, cancelLabel: 'Close' });
    }
  }
